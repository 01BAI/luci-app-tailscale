# GitHub Release 仓库（格式：GitHub用户名/仓库名）
# 安装脚本与 LuCI 会从此仓库的 Releases 下载 tailscaled-linux-<架构>
#
# 示例：你的账号是 lou，仓库名 luci-app-tailscale
# GITHUB_RELEASE_REPO=lou/luci-app-tailscale
#
# 修改后保存，无需重新编译 ipk（热部署 /etc/tailscale/release.conf 即可）
#
# 可选 HTTP 代理（路由器本机出站，非透明代理时）：
#   创建 /etc/tailscale/proxy.env，内容例如：
#   HTTP_PROXY=http://127.0.0.1:7890
#   HTTPS_PROXY=http://127.0.0.1:7890
#
# GitHub 镜像（直连不可达时）：/etc/tailscale/proxies.txt

GITHUB_RELEASE_REPO=01BAI/luci-app-tailscale
