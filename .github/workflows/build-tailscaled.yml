# 从 Tailscale 官方源码交叉编译 tailscaled 与 derper，发布到本仓库 GitHub Release。
# tailscaled: go build -tags ts_include_cli -ldflags='-s -w' ./cmd/tailscaled
# derper:     go build -ldflags='-s -w' ./cmd/derper（与 tailscaled 同 tag，版本对齐）
#
# 触发方式：
#   - 定时：每天检查官方 latest，本仓库尚无对应 Release 时自动打包
#   - 手动：Actions → Build tailscaled for OpenWrt → Run workflow

name: Build tailscaled for OpenWrt

on:
  schedule:
    # 每天 08:00 UTC（北京时间 16:00）检查官方是否有新版本
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      tailscale_version:
        description: "Tailscale 版本 tag，例如 v1.98.8；留空则自动取官方 latest"
        required: false
        default: ""
      force:
        description: "即使本仓库已有该版本 Release，也强制重新编译发布"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  REPO_OFFICIAL: tailscale/tailscale
  BUILD_PLATFORMS: amd64 386 arm arm64 mips mipsle mips64 mips64le
  GO_BUILD_FLAGS: "-tags ts_include_cli -ldflags='-s -w'"
  DERP_BUILD_FLAGS: "-ldflags='-s -w'"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.out.outputs.tag }}
      version: ${{ steps.out.outputs.version }}
      should_build: ${{ steps.out.outputs.should_build }}
    steps:
      - name: Resolve Tailscale version
        id: out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT: ${{ github.event.inputs.tailscale_version || '' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          if [ -n "$INPUT" ]; then
            TAG="$INPUT"
          else
            TAG="$(curl -fsSL "https://api.github.com/repos/${{ env.REPO_OFFICIAL }}/releases/latest" | jq -r '.tag_name')"
          fi
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "无法获取 Tailscale 版本"; exit 1; }
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "官方目标版本: ${TAG}"

          EXISTS=false
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            EXISTS=true
            echo "本仓库已有 Release: ${TAG}"
          else
            echo "本仓库尚无 Release: ${TAG}"
          fi

          SHOULD_BUILD=true
          if [ "$EXISTS" = "true" ]; then
            if [ "$EVENT_NAME" = "schedule" ]; then
              SHOULD_BUILD=false
              echo "定时检查：版本已存在，跳过构建"
            elif [ "$FORCE" != "true" ]; then
              SHOULD_BUILD=false
              echo "手动触发：版本已存在且未勾选 force，跳过构建"
            else
              echo "手动触发：force=true，将覆盖重新发布 ${TAG}"
            fi
          fi

          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"
          if [ "$SHOULD_BUILD" = "true" ]; then
            echo "将构建 Tailscale ${TAG}"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, 386, arm, arm64, mips, mipsle, mips64, mips64le]

    steps:
      - name: Checkout Tailscale source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_OFFICIAL }}
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install latest UPX
        run: |
          set -e
          LATEST_UPX=$(curl -s https://api.github.com/repos/upx/upx/releases/latest | grep -oP '"tag_name": "v\K[0-9.]+' | head -n1)
          echo "Latest UPX version: $LATEST_UPX"
          curl -LO "https://github.com/upx/upx/releases/download/v${LATEST_UPX}/upx-${LATEST_UPX}-amd64_linux.tar.xz"
          tar -xf "upx-${LATEST_UPX}-amd64_linux.tar.xz"
          sudo cp "upx-${LATEST_UPX}-amd64_linux/upx" /usr/local/bin/
          upx --version

      - name: Build tailscaled + derper (${{ matrix.arch }})
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          case "${{ matrix.arch }}" in
            mips|mipsle)
              export GOMIPS=softfloat
              ;;
          esac

          binary_build="tailscaled-linux-${{ matrix.arch }}.build"
          go build -o "$binary_build" ${{ env.GO_BUILD_FLAGS }} ./cmd/tailscaled
          ls -la "$binary_build"

          derper_build="derper-linux-${{ matrix.arch }}.build"
          go build -o "$derper_build" ${{ env.DERP_BUILD_FLAGS }} ./cmd/derper
          ls -la "$derper_build"

      - name: Compress binaries (${{ matrix.arch }})
        run: |
          binary_build="tailscaled-linux-${{ matrix.arch }}.build"
          compressed="tailscaled-linux-${{ matrix.arch }}"

          case "${{ matrix.arch }}" in
            mips64|mips64le)
              echo "跳过 ${{ matrix.arch }} 的 UPX 压缩（与 CH3NGYZ 一致）"
              cp "$binary_build" "$compressed"
              ;;
            *)
              upx --lzma --best --no-progress "$binary_build" -o "$compressed"
              ;;
          esac

          derper_build="derper-linux-${{ matrix.arch }}.build"
          derper_out="derper-linux-${{ matrix.arch }}"

          case "${{ matrix.arch }}" in
            mips64|mips64le)
              cp "$derper_build" "$derper_out"
              ;;
            *)
              upx --lzma --best --no-progress "$derper_build" -o "$derper_out"
              ;;
          esac

          ls -la "$binary_build" "$compressed" "$derper_build" "$derper_out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscaled-${{ matrix.arch }}
          path: |
            tailscaled-linux-${{ matrix.arch }}
            tailscaled-linux-${{ matrix.arch }}.build
            derper-linux-${{ matrix.arch }}
            derper-linux-${{ matrix.arch }}.build
          if-no-files-found: error

  release:
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          ls -la
          echo "${{ needs.resolve.outputs.tag }}" > version.txt
          sha256sum tailscaled-linux-*.build derper-linux-*.build > SHA256SUMS.txt
          for f in tailscaled-linux-* derper-linux-*; do
            case "$f" in *.build) continue ;; esac
            sha256sum "$f"
          done >> SHA256SUMS.txt
          md5sum tailscaled-linux-*.build derper-linux-*.build > MD5SUMS.txt
          for f in tailscaled-linux-* derper-linux-*; do
            case "$f" in *.build) continue ;; esac
            md5sum "$f"
          done >> MD5SUMS.txt
          sed -i 's/  */ /g' SHA256SUMS.txt MD5SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: Tailscale ${{ needs.resolve.outputs.tag }} (OpenWrt binaries)
          draft: false
          prerelease: false
          make_latest: true
          body: |
            由 GitHub Actions 从 [tailscale/tailscale](https://github.com/tailscale/tailscale) `${{ needs.resolve.outputs.tag }}` 交叉编译。

            编译方式与 [CH3NGYZ/small-tailscale-openwrt](https://github.com/CH3NGYZ/small-tailscale-openwrt) 一致：
            `go build -tags ts_include_cli -ldflags='-s -w' ./cmd/tailscaled`，UPX 压缩后发布 `tailscaled-linux-*`。

            同 tag 另编译 DERP 中继：`go build -ldflags='-s -w' ./cmd/derper`，发布 `derper-linux-*`（与 tailscaled 版本一致，可用于自建 DERP）。

            - tailscaled：下载 `tailscaled-linux-<arch>`，软链为 `/usr/bin/tailscale` 与 `/usr/bin/tailscaled`
            - derper：下载 `derper-linux-<arch>`，安装到 `/usr/local/bin/derper` 并配置 procd 服务
          files: |
            dist/tailscaled-linux-*
            dist/tailscaled-linux-*.build
            dist/derper-linux-*
            dist/derper-linux-*.build
            dist/version.txt
            dist/SHA256SUMS.txt
            dist/MD5SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
