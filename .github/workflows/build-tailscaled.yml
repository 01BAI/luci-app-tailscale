# 从 Tailscale 官方源码交叉编译 tailscaled，发布到本仓库 GitHub Release。
# 编译方式严格对齐 CH3NGYZ/small-tailscale-openwrt：
#   go build -tags ts_include_cli -ldflags='-s -w' ./cmd/tailscaled
# 单一二进制 + 软链同时作为 tailscale / tailscaled 使用，再 UPX 压缩。
#
# 使用：GitHub 网页 → Actions → Build tailscaled for OpenWrt → Run workflow

name: Build tailscaled for OpenWrt

on:
  workflow_dispatch:
    inputs:
      tailscale_version:
        description: "Tailscale 版本 tag，例如 v1.98.8；留空则自动取官方 latest"
        required: false
        default: ""

permissions:
  contents: write

env:
  REPO_OFFICIAL: tailscale/tailscale
  BUILD_PLATFORMS: amd64 386 arm arm64 mips mipsle mips64 mips64le
  GO_BUILD_FLAGS: "-tags ts_include_cli -ldflags='-s -w'"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.out.outputs.tag }}
      version: ${{ steps.out.outputs.version }}
    steps:
      - name: Resolve Tailscale version
        id: out
        run: |
          INPUT="${{ github.event.inputs.tailscale_version }}"
          if [ -n "$INPUT" ]; then
            TAG="$INPUT"
          else
            TAG="$(curl -fsSL https://api.github.com/repos/${{ env.REPO_OFFICIAL }}/releases/latest | jq -r '.tag_name')"
          fi
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "无法获取 Tailscale 版本"; exit 1; }
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "将构建 Tailscale ${TAG}"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, 386, arm, arm64, mips, mipsle, mips64, mips64le]

    steps:
      - name: Checkout Tailscale source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_OFFICIAL }}
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install latest UPX
        run: |
          set -e
          LATEST_UPX=$(curl -s https://api.github.com/repos/upx/upx/releases/latest | grep -oP '"tag_name": "v\K[0-9.]+' | head -n1)
          echo "Latest UPX version: $LATEST_UPX"
          curl -LO "https://github.com/upx/upx/releases/download/v${LATEST_UPX}/upx-${LATEST_UPX}-amd64_linux.tar.xz"
          tar -xf "upx-${LATEST_UPX}-amd64_linux.tar.xz"
          sudo cp "upx-${LATEST_UPX}-amd64_linux/upx" /usr/local/bin/
          upx --version

      - name: Build tailscaled (${{ matrix.arch }})
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          case "${{ matrix.arch }}" in
            mips|mipsle)
              export GOMIPS=softfloat
              ;;
          esac

          binary_build="tailscaled-linux-${{ matrix.arch }}.build"
          go build -o "$binary_build" ${{ env.GO_BUILD_FLAGS }} ./cmd/tailscaled
          ls -la "$binary_build"

      - name: Compress binary (${{ matrix.arch }})
        run: |
          binary_build="tailscaled-linux-${{ matrix.arch }}.build"
          compressed="tailscaled-linux-${{ matrix.arch }}"

          case "${{ matrix.arch }}" in
            mips64|mips64le)
              echo "跳过 ${{ matrix.arch }} 的 UPX 压缩（与 CH3NGYZ 一致）"
              cp "$binary_build" "$compressed"
              ;;
            *)
              upx --lzma --best --no-progress "$binary_build" -o "$compressed"
              ;;
          esac

          ls -la "$binary_build" "$compressed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscaled-${{ matrix.arch }}
          path: |
            tailscaled-linux-${{ matrix.arch }}
            tailscaled-linux-${{ matrix.arch }}.build
          if-no-files-found: error

  release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          ls -la
          echo "${{ needs.resolve.outputs.tag }}" > version.txt
          sha256sum tailscaled-linux-*.build > SHA256SUMS.txt
          for f in tailscaled-linux-*; do
            case "$f" in *.build) continue ;; esac
            sha256sum "$f"
          done >> SHA256SUMS.txt
          md5sum tailscaled-linux-*.build > MD5SUMS.txt
          for f in tailscaled-linux-*; do
            case "$f" in *.build) continue ;; esac
            md5sum "$f"
          done >> MD5SUMS.txt
          sed -i 's/  */ /g' SHA256SUMS.txt MD5SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: Tailscale ${{ needs.resolve.outputs.tag }} (OpenWrt binaries)
          draft: false
          prerelease: false
          make_latest: true
          body: |
            由 GitHub Actions 从 [tailscale/tailscale](https://github.com/tailscale/tailscale) `${{ needs.resolve.outputs.tag }}` 交叉编译。

            编译方式与 [CH3NGYZ/small-tailscale-openwrt](https://github.com/CH3NGYZ/small-tailscale-openwrt) 一致：
            `go build -tags ts_include_cli -ldflags='-s -w' ./cmd/tailscaled`，UPX 压缩后发布 `tailscaled-linux-*`。

            安装时下载 `tailscaled-linux-<arch>`，软链为 `/usr/bin/tailscale` 与 `/usr/bin/tailscaled` 即可。
          files: |
            dist/tailscaled-linux-*
            dist/tailscaled-linux-*.build
            dist/version.txt
            dist/SHA256SUMS.txt
            dist/MD5SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
