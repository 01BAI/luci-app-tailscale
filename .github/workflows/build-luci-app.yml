# 自动编译 luci-app-tailscale ipk，发布到 GitHub Release 供手动安装。
# LuCI 包架构为 all，任意 OpenWrt 路由器均可安装同一 ipk。
#
# 使用：
#   - push 到 main：编译并更新预发布 luci-latest（附 ipk 下载）
#   - 打 tag luci-v*（如 luci-v1.0.0）：创建正式 Release
#   - Actions → Build luci-app-tailscale → Run workflow

name: Build luci-app-tailscale

on:
  push:
    branches: [main, master]
    tags: ['luci-v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  OPENWRT_VERSION: v24.10.3
  PACKAGE_NAME: luci-app-tailscale
  TRANSLATION_PKG: tailscale
  SDK_DIR: /home/runner/work/openwrt-sdk

permissions:
  contents: write

jobs:
  build:
    name: Build ipk (all arch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync unzip zstd coreutils
          sudo ln -sf /usr/bin/sha256sum /usr/bin/sha256

      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_DIR }}
          key: ${{ runner.os }}-sdk-x86_64-${{ env.OPENWRT_VERSION }}-v2

      - name: Download and extract OpenWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          release_version="${OPENWRT_VERSION#v}"
          sdk_url_prefix="https://downloads.openwrt.org/releases/${release_version}/targets/x86/64"

          sdk_filename="$(curl -fsSL "$sdk_url_prefix/" \
            | grep -oE 'openwrt-sdk-[^"]+\.(tar\.xz|tar\.zst)' \
            | head -n1)"

          if [ -z "$sdk_filename" ]; then
            echo "::error::未找到 SDK：${sdk_url_prefix}/"
            exit 1
          fi

          echo "Downloading ${sdk_filename} ..."
          curl -fSL "${sdk_url_prefix}/${sdk_filename}" -o "$sdk_filename"

          case "$sdk_filename" in
            *.tar.zst) tar --zstd -xf "$sdk_filename" ;;
            *.tar.xz) tar -xf "$sdk_filename" ;;
          esac
          mv "$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)" "${{ env.SDK_DIR }}"
          rm -f "$sdk_filename"

          cd "${{ env.SDK_DIR }}"
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p luci || true

      - name: Prepare package
        working-directory: ${{ env.SDK_DIR }}
        run: |
          rm -rf "package/${{ env.PACKAGE_NAME }}"
          mkdir -p "package/${{ env.PACKAGE_NAME }}"
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'openwrt-sdk' \
            --exclude '.reference' \
            "${{ github.workspace }}/" "./package/${{ env.PACKAGE_NAME }}/"

          TARGET_MK="./package/${{ env.PACKAGE_NAME }}/Makefile"
          [ -f "$TARGET_MK" ] || { echo "::error::Makefile 不存在"; exit 1; }

          if ! grep -q '^PKG_VERSION:=' "$TARGET_MK"; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              NEW_VER="$(echo "${{ github.ref_name }}" | sed 's/^luci-v//')"
              NEW_REL="1"
            else
              NEW_VER="$(date +'%Y.%m.%d')"
              SHORT_SHA="$(git -C "${{ github.workspace }}" rev-parse --short HEAD)"
              NEW_REL="${{ github.run_number }}.git-${SHORT_SHA}"
            fi
            sed -i "s|include \$(TOPDIR)/rules.mk|include \$(TOPDIR)/rules.mk\nPKG_VERSION:=${NEW_VER}\nPKG_RELEASE:=${NEW_REL}|" "$TARGET_MK"
            echo "PKG_VERSION=${NEW_VER} PKG_RELEASE=${NEW_REL}"
          fi

          rm -rf output_ipk
          find ./bin -type f -name "${{ env.PACKAGE_NAME }}*.ipk" -delete 2>/dev/null || true

      - name: Compile ipk
        working-directory: ${{ env.SDK_DIR }}
        run: |
          {
            echo "CONFIG_PACKAGE_${{ env.PACKAGE_NAME }}=m"
            echo "CONFIG_PACKAGE_luci-i18n-${{ env.TRANSLATION_PKG }}-zh-cn=m"
            echo "CONFIG_LUCI_LANG_zh_Hans=y"
          } > .config
          make defconfig
          make "package/${{ env.PACKAGE_NAME }}/compile" V=s -j"$(nproc)"

          mkdir -p output_ipk
          find ./bin/packages -type f \( \
            -name "${{ env.PACKAGE_NAME }}*.ipk" -o \
            -name "luci-i18n-${{ env.TRANSLATION_PKG }}-*.ipk" \
          \) -exec cp {} output_ipk/ \;

          if [ -z "$(ls -A output_ipk 2>/dev/null)" ]; then
            echo "::error::未找到 ipk 产物"
            find ./bin -name '*.ipk' || true
            exit 1
          fi
          ls -la output_ipk/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-tailscale-ipk
          path: ${{ env.SDK_DIR }}/output_ipk/*.ipk

  release:
    name: Publish ipk to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: luci-app-tailscale-ipk
          path: release-assets

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/luci-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: luci-app-tailscale ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.ipk

      - name: Publish latest pre-release (main)
        if: "!startsWith(github.ref, 'refs/tags/luci-v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: luci-latest
          name: luci-app-tailscale (latest build)
          prerelease: true
          make_latest: false
          body: |
            由 main 分支自动编译的开发版 ipk，可直接下载后手动安装。

            **正式版请使用 [luci-v* Release](https://github.com/${{ github.repository }}/releases?q=luci-v&expanded=true)。**

            ```sh
            # 下载后上传到路由器 /tmp，然后：
            opkg install /tmp/luci-app-tailscale_*.ipk
            opkg install /tmp/luci-i18n-tailscale-zh-cn_*.ipk
            ```
          files: release-assets/*.ipk
