# 自动编译 luci-app-tailscale ipk，发布到 GitHub Pages（opkg 软件源）。
# LuCI 包架构为 all，任意 OpenWrt 路由器均可安装同一 ipk。
#
# 使用：
#   - push 到 main：自动编译并更新 Pages 软件源
#   - 打 tag luci-v*（如 luci-v1.0.0）：额外创建 GitHub Release 附件
#   - Actions → Build luci-app-tailscale → Run workflow

name: Build luci-app-tailscale

on:
  push:
    branches: [main, master]
    tags: ['luci-v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  OPENWRT_VERSION: v24.10.3
  PACKAGE_NAME: luci-app-tailscale
  SDK_DIR: /home/runner/work/openwrt-sdk

permissions:
  contents: write

jobs:
  build:
    name: Build ipk (all arch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync unzip zstd coreutils cmake
          sudo ln -sf /usr/bin/sha256sum /usr/bin/sha256

      - name: Setup usign
        run: |
          git clone --depth 1 https://github.com/openwrt/usign.git
          cd usign && mkdir build && cd build
          cmake .. && make -j"$(nproc)"
          sudo make install
          cd ../.. && rm -rf usign

      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_DIR }}
          key: ${{ runner.os }}-sdk-x86_64-${{ env.OPENWRT_VERSION }}

      - name: Download and extract OpenWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          release_version="${OPENWRT_VERSION#v}"
          sdk_url_prefix="https://downloads.openwrt.org/releases/${release_version}/targets/x86/64"

          sdk_filename="$(curl -fsSL "$sdk_url_prefix/" \
            | grep -oE 'openwrt-sdk-[^"]+\.(tar\.xz|tar\.zst)' \
            | head -n1)"

          if [ -z "$sdk_filename" ]; then
            echo "::error::未找到 SDK：${sdk_url_prefix}/"
            exit 1
          fi

          echo "Downloading ${sdk_filename} ..."
          curl -fSL "${sdk_url_prefix}/${sdk_filename}" -o "$sdk_filename"

          case "$sdk_filename" in
            *.tar.zst) tar --zstd -xf "$sdk_filename" ;;
            *.tar.xz) tar -xf "$sdk_filename" ;;
          esac
          mv "$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)" "${{ env.SDK_DIR }}"
          rm -f "$sdk_filename"

          cd "${{ env.SDK_DIR }}"
          ./scripts/feeds update luci
          ./scripts/feeds install -a -p luci

      - name: Prepare package
        working-directory: ${{ env.SDK_DIR }}
        run: |
          rm -rf "package/${{ env.PACKAGE_NAME }}"
          mkdir -p "package/${{ env.PACKAGE_NAME }}"
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'openwrt-sdk' \
            --exclude '.reference' \
            "${{ github.workspace }}/" "./package/${{ env.PACKAGE_NAME }}/"

          TARGET_MK="./package/${{ env.PACKAGE_NAME }}/Makefile"
          [ -f "$TARGET_MK" ] || { echo "::error::Makefile 不存在"; exit 1; }

          if ! grep -q '^PKG_VERSION:=' "$TARGET_MK"; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              NEW_VER="$(echo "${{ github.ref_name }}" | sed 's/^luci-v//')"
              NEW_REL="1"
            else
              NEW_VER="$(date +'%Y.%m.%d')"
              SHORT_SHA="$(git -C "${{ github.workspace }}" rev-parse --short HEAD)"
              NEW_REL="${{ github.run_number }}.git-${SHORT_SHA}"
            fi
            sed -i "s|include \$(TOPDIR)/rules.mk|include \$(TOPDIR)/rules.mk\nPKG_VERSION:=${NEW_VER}\nPKG_RELEASE:=${NEW_REL}|" "$TARGET_MK"
            echo "PKG_VERSION=${NEW_VER} PKG_RELEASE=${NEW_REL}"
          fi

          rm -rf output_ipk upload
          find ./bin -type f -name "${{ env.PACKAGE_NAME }}*.ipk" -delete 2>/dev/null || true

      - name: Compile ipk
        working-directory: ${{ env.SDK_DIR }}
        run: |
          translation_pkg="${{ env.PACKAGE_NAME#luci-app- }}"
          {
            echo "CONFIG_PACKAGE_${{ env.PACKAGE_NAME }}=m"
            echo "CONFIG_PACKAGE_luci-i18n-${translation_pkg}-zh-cn=m"
            echo "CONFIG_LUCI_LANG_zh_Hans=y"
          } > .config
          make defconfig
          make "package/${{ env.PACKAGE_NAME }}/compile" V=sw -j"$(nproc)"

          mkdir -p output_ipk
          find ./bin/packages -type f \( \
            -name "${{ env.PACKAGE_NAME }}*.ipk" -o \
            -name "luci-i18n-${translation_pkg}-*.ipk" \
          \) -exec cp {} output_ipk/ \;

          if [ -z "$(ls -A output_ipk 2>/dev/null)" ]; then
            echo "::error::未找到 ipk 产物"
            find ./bin -name '*.ipk' || true
            exit 1
          fi
          ls -la output_ipk/

      - name: Sign and index
        id: collect
        working-directory: ${{ env.SDK_DIR }}
        run: |
          REL_PATH="all"
          mkdir -p "upload/${REL_PATH}"
          cp output_ipk/*.ipk "upload/${REL_PATH}/"

          if [ -z "${{ secrets.USIGN_KEY }}" ]; then
            echo "::warning title=Missing USIGN_KEY::未配置 USIGN_KEY，本次使用临时签名密钥"
            usign -G -s /tmp/key-build.sig -p "upload/${REL_PATH}/key-build.pub" -c "luci-app-tailscale CI"
          else
            echo "${{ secrets.USIGN_KEY }}" > /tmp/key-build.sig
            KEY_HEX="$(tail -n 1 /tmp/key-build.sig | base64 -d | xxd -p | tr -d '\n')"
            [ "${#KEY_HEX}" -eq 208 ] || { echo "::error::USIGN_KEY 无效"; exit 1; }
            echo "untrusted comment: public key ${KEY_HEX:64:16}" > "upload/${REL_PATH}/key-build.pub"
            echo "${KEY_HEX:0:4}${KEY_HEX:64:16}${KEY_HEX:144:64}" | xxd -r -p | base64 -w 0 >> "upload/${REL_PATH}/key-build.pub"
          fi

          TARGET_DIR="upload/${REL_PATH}"
          touch "${TARGET_DIR}/Packages"
          for ipk in "${TARGET_DIR}"/*.ipk; do
            pkg_info="$(tar -xOzf "$ipk" ./control.tar.gz | tar -xOzf - ./control)"
            {
              echo "$pkg_info"
              echo "Filename: $(basename "$ipk")"
              echo "Size: $(stat -c%s "$ipk")"
              echo "SHA256sum: $(sha256sum "$ipk" | awk '{print $1}')"
              echo ""
            } >> "${TARGET_DIR}/Packages"
          done
          gzip -9nc "${TARGET_DIR}/Packages" > "${TARGET_DIR}/Packages.gz"
          usign -S -m "${TARGET_DIR}/Packages" -s /tmp/key-build.sig -x "${TARGET_DIR}/Packages.sig"
          rm -f /tmp/key-build.sig

          echo "path=upload" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-tailscale-ipk
          path: ${{ env.SDK_DIR }}/upload

  deploy-pages:
    name: Deploy opkg feed (GitHub Pages)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/luci-v') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: luci-app-tailscale-ipk
          path: feed

      - name: Prepare Pages site
        run: |
          mkdir -p deploy/all
          cp feed/all/* deploy/all/
          touch deploy/.nojekyll

          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO='${{ github.event.repository.name }}'
          FEED_URL="https://${OWNER_LC}.github.io/${REPO}/all"

          cat > deploy/index.html <<EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <title>luci-app-tailscale opkg feed</title>
            <style>
              body { font-family: system-ui, sans-serif; line-height: 1.6; max-width: 720px; margin: 40px auto; padding: 0 20px; }
              pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow: auto; }
            </style>
          </head>
          <body>
            <h1>luci-app-tailscale</h1>
            <p>OpenWrt LuCI 插件 opkg 软件源（架构 <code>all</code>，适用各平台路由器）。</p>
            <h2>安装</h2>
            <pre><code># 1. 添加公钥
          wget ${FEED_URL}/key-build.pub -O /tmp/key-build.pub
          opkg-key add /tmp/key-build.pub

          # 2. 添加软件源
          echo "src/gz luci-app-tailscale ${FEED_URL}" >> /etc/opkg/customfeeds.conf

          # 3. 安装
          opkg update
          opkg install luci-app-tailscale luci-i18n-tailscale-zh-cn</code></pre>
            <p>Feed URL: <code>${FEED_URL}</code></p>
            <p><a href="https://github.com/${{ github.repository }}">GitHub 仓库</a></p>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: true

  release:
    name: Publish Release (luci-v* tags)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/luci-v')
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: luci-app-tailscale-ipk
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: luci-app-tailscale ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/all/*.ipk
